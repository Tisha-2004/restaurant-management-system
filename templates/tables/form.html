{% extends "admin_base.html" %}
{% block breadcrumb %}{{ title }}{% endblock %}
{% block content %}
<div class="card glass-card p-4" style="max-width:520px">
  <h4 class="fw-bold mb-3">{{ title }}</h4>
  <form method="post" novalidate>{% csrf_token %}
    {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
      {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn btn-orange">Save</button>
    <a class="btn btn-light" href="{% url 'tables:list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
