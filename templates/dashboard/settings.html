{% extends "admin_base.html" %}
{% block breadcrumb %}Settings{% endblock %}
{% block content %}
<div class="card glass-card p-4" style="max-width:820px">
  <h4 class="fw-bold mb-3">Restaurant Settings</h4>
  <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
    <div class="row g-3">
      {% for field in form %}<div class="col-md-6"><label class="form-label">{{ field.label }}</label>{{ field }}
        {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
    </div>
    <button class="btn btn-orange mt-4">Save settings</button>
  </form>
</div>
{% endblock %}
