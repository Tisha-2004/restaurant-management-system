{% extends "admin_base.html" %}
{% block breadcrumb %}Edit user{% endblock %}
{% block content %}
<div class="card glass-card p-4" style="max-width:640px">
  <h4 class="fw-bold mb-3">Edit user</h4>
  <form method="post">{% csrf_token %}
    {% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}
      {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}</div>{% endfor %}
    <button class="btn btn-orange">Save</button>
    <a class="btn btn-light" href="{% url 'accounts:user_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
