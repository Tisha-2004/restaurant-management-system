{% extends "admin_base.html" %}
{% block breadcrumb %}{{ title }}{% endblock %}
{% block content %}
<div class="card glass-card p-4" style="max-width:760px">
  <h4 class="fw-bold mb-3">{{ title }}</h4>
  <form method="post" enctype="multipart/form-data" novalidate>{% csrf_token %}
    <div class="row g-3">
      {% for field in form %}
        <div class="{% if field.name == 'description' %}col-12{% else %}col-md-6{% endif %}">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
        </div>
      {% endfor %}
    </div>
    <!-- Live preview of the selected image before uploading -->
    <div class="mt-3"><img id="imagePreview" class="img-preview d-none" alt="preview"
      {% if object and object.src %}src="{{ object.src }}"{% endif %}></div>
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-orange">Save</button>
      <a class="btn btn-light" href="{% url 'menu:manage' %}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
